# Prometheus 抓取配置示例
#
# 用法：
#   1. 启动 Prometheus：prometheus --config.file=prometheus.yml
#   2. 或通过 Docker：docker run -p 9090:9090 -v ./prometheus.yml:/etc/prometheus/prometheus.yml prom/prometheus
#
# 后端 /metrics 端点暴露以下指标：
#   - http_requests_total: HTTP 请求总数（method/route/status）
#   - http_request_duration_seconds: HTTP 请求耗时直方图
#   - paint_work_orders_total: 喷漆工单创建总数（shop_id/source）
#   - paint_ocr_recognition_total: OCR 识别调用总数（shop_id/status）
#   - paint_excel_imports_total: Excel 导入总数（shop_id/status）
#   - node_*: Node.js 默认指标（内存、CPU、事件循环等）

global:
  scrape_interval: 15s          # 每 15 秒抓取一次
  evaluation_interval: 15s      # 每 15 秒评估一次告警规则

# 告警规则（可选）
# rule_files:
#   - "alerts.yml"

scrape_configs:
  # 后端应用指标
  - job_name: 'paint-count-backend'
    metrics_path: '/metrics'
    scrape_interval: 10s        # 业务指标 10 秒抓取一次
    static_configs:
      - targets: ['localhost:9528']   # 后端服务地址
        labels:
          service: 'backend'
          env: 'production'

  # Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# 告警示例（可选，需要配合 alertmanager）：
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['localhost:9093']
